name: Basic Structure Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test lifecycle gates
        run: node --test test/gates.test.mjs test/policies.test.mjs test/cli.test.mjs
      - name: Verify starter catalog
        run: node scripts/verify.mjs --mode template
